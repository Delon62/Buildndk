name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil header AML
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml_src
          mkdir -p aml_headers && cp -r aml_src/mod aml_headers/mod
      - name: Build
        run: $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: libAntiKebalik
          path: libs/armeabi-v7a/libAntiKebalik.so
